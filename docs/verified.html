<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email 驗證成功 - 數位車庫 Digital Garage</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card-outer {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 4px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }
    .card-inner {
      background: #121215;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 36px 28px;
      text-align: center;
    }
    .icon-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.12);
      border: 2px solid #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.25);
    }
    .icon-badge svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: #10b981;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #ff5500;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
      color: #ffffff;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #a1a1aa;
      margin-bottom: 24px;
    }
    .highlight-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      color: #e4e4e7;
      margin-bottom: 24px;
    }
    .footer-note {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: #71717a;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="card-outer">
    <div class="card-inner">
      <div class="icon-badge">
        <svg viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>

      <div class="tag">SECURE ACCESS VERIFIED</div>
      <h1>Email 驗證成功</h1>

      <p>您的車主電子信箱已通過安全驗證！</p>

      <div class="highlight-box">
        請返回手機上的<strong>「數位車庫」App</strong>，<br>輸入您的帳號密碼，即可進入車庫座艙。
      </div>

      <div class="footer-note">DIGITAL GARAGE · AUTHENTICATION COMPLETED</div>
    </div>
  </div>
</body>
</html>
